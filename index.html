<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBEFEF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>My Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --lavender:#C5B3D3; --rose:#F5CBCB; --blush:#FFE2E2; --petal:#FBEFEF;
  --sage:#8FA28A; --sage-lt:#C7D3C0; --cream:#F7F4ED; --gold:#C8A96B;
  --mint:#E6F2DD; --mint2:#B1D3B9; --snow:#FCF8F8; --sky:#C6E7FF; --sky-lt:#D4F6FF;
  --olive:#BEC6A0; --forest:#708871; --sand:#E5DDC5; --pink:#F7C8E0;

  --bg:var(--petal); --card:var(--snow); --card2:var(--cream);
  --ink:#5B4A54; --ink-soft:#8C7A84; --line:#EBD9DC; --accent:#D98FA6;
  --field:#FFFFFF; --shadow:0 3px 0 #EFD9DE; --add-bg:var(--petal); --dot-ink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A2530; --card:#352E3B; --card2:#3B3441; --ink:#F3E6EC; --ink-soft:#C3B2BC;
    --line:#4E4455; --accent:#F7C8E0; --field:#2F2935; --shadow:0 3px 0 #221D27; --add-bg:#43394A; --dot-ink:#6d3f52;
  }
}
:root[data-theme="dark"]{
  --bg:#2A2530; --card:#352E3B; --card2:#3B3441; --ink:#F3E6EC; --ink-soft:#C3B2BC;
  --line:#4E4455; --accent:#F7C8E0; --field:#2F2935; --shadow:0 3px 0 #221D27; --add-bg:#43394A; --dot-ink:#6d3f52;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;
  background-image:radial-gradient(var(--line) 1.2px, transparent 1.3px);background-size:22px 22px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.hand{font-family:"Mali","Zen Maru Gothic","Comic Sans MS","Chalkboard SE",cursive}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.hidden{display:none!important}
svg{display:block}

/* ---------- calendar ---------- */
.hero{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin:8px 0 14px}
.hero h1{font-family:"Mali",cursive;margin:0;line-height:.95;text-align:center;font-size:clamp(30px,8vw,46px);color:var(--ink);letter-spacing:.5px}
.hero h1 small{display:block;font-size:.62em;color:var(--accent);margin-top:4px}
.hero .buddy{width:74px;flex:none}
.tag{text-align:center;color:var(--ink-soft);font-size:14px;margin:-4px 0 16px}
.cal{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:14px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.nav-btn{width:40px;height:40px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-size:20px;font-weight:800;color:#8a5a6a;flex:none}
.pickers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pickers select{appearance:none;-webkit-appearance:none;border:2px solid var(--line);background:var(--field);border-radius:14px;padding:6px 12px;font-family:"Mali",cursive;font-weight:700;font-size:17px;text-align:center}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow div{text-align:center;font-weight:800;font-size:12px;color:var(--ink-soft);padding:4px 0}
.dow div:last-child{color:var(--accent)}
.day{position:relative;aspect-ratio:1;border-radius:16px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;transition:transform .12s}
.day:active{transform:scale(.93)}
.day.out{opacity:.35}
.day.sun{color:#C9728D}
.day.today{background:#B1D3B9;color:#2F4A36;box-shadow:inset 0 0 0 2px #8FA28A}
.day.today::before{content:'✦';position:absolute;top:3px;right:6px;font-size:10px;color:#708871}
.day.sel{background:var(--pink);color:#6d3f52;box-shadow:inset 0 0 0 2.5px #D98FA6,0 0 0 3px var(--blush)}
.day.today.sel{background:#B1D3B9;color:#2F4A36;box-shadow:inset 0 0 0 2.5px #8FA28A,0 0 0 3px #D98FA6}
.day.sel-pop{animation:selPop .6s var(--ease)}
@keyframes selPop{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.day.sel-pop{animation:none}}
.legend{flex-wrap:wrap;row-gap:4px}
.lg-sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.day .mk{position:absolute;bottom:3px;width:12px;height:11px}
.day{padding-bottom:6px}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.pill{background:var(--mint);color:#4d6450;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--ink-soft);align-items:center}
.legend span{display:inline-flex;gap:4px;align-items:center}
.quote{margin:18px auto 0;max-width:520px;display:flex;gap:10px;align-items:center;background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:12px 14px;font-size:14px}
.quote svg{width:46px;flex:none}

/* ---------- day page ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--bg)}
.back{width:42px;height:42px;border-radius:14px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:800}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-family:"Mali",cursive;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t span{font-size:12px;color:var(--ink-soft)}
.saved{font-size:12px;color:var(--forest);font-weight:800;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.daynav{width:38px;height:38px;border-radius:50%;background:var(--blush);font-weight:800;color:#8a5a6a}

.title-block{text-align:center;margin:4px 0 16px;position:relative}
.title-block h2{font-family:"Mali",cursive;margin:0;font-size:clamp(28px,7.5vw,40px);line-height:1}
.title-block h2 .l2{display:block;color:var(--accent)}
.title-block .ribbon{display:inline-block;margin-top:8px;background:var(--blush);border-radius:999px;padding:4px 14px;font-size:13px;color:#8a5a6a}
.title-block .sL,.title-block .sR{position:absolute;width:62px;top:0}
.title-block .sL{left:0}.title-block .sR{right:0}

.grid2{display:grid;gap:14px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.box{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.box-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--blush);border-bottom:2px solid var(--line)}
.box-h h3{margin:0;font-family:"Mali",cursive;font-size:17px;flex:1}
.box-h .ic{width:26px;height:26px;flex:none}
.box-h h3{min-width:0}
.ttl{width:100%;min-width:0;border:0;background:transparent;font:inherit;color:inherit;padding:2px 4px;border-radius:8px;border-bottom:2px dashed transparent}
.ttl:hover{border-bottom-color:rgba(107,85,96,.25)}
.ttl:focus{outline:none;background:var(--field);border-bottom-color:var(--accent)}
.box-h .pen{font-size:14px;color:var(--ink-soft);opacity:.7;flex:none}
.box.sage .box-h{background:var(--mint)}
.box.sky .box-h{background:var(--sky-lt)}
.box.lav .box-h{background:#EDE4F3}
.box.sand .box-h{background:var(--cream)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .box-h{background:#43394A!important}}
:root[data-theme="dark"] .box-h{background:#43394A!important}
.box-b{padding:12px 14px}

.info-row{display:grid;grid-template-columns:30px minmax(80px,120px) 1fr 26px;align-items:center;gap:6px;padding:6px 0;border-bottom:1.5px dashed var(--line)}
.info-row .lbl{font-weight:800;font-size:13.5px;min-width:0}
.info-row .ival{min-width:0}
.info-row .xs{width:26px;height:26px;border-radius:50%;background:var(--blush);color:#9b5b70;font-weight:800;display:grid;place-items:center;font-size:14px}
.iic{width:30px;height:30px;border-radius:10px;font-size:17px;display:grid;place-items:center}
.iic:hover{background:var(--card2)}
.field{width:100%;border:0;border-bottom:2px solid transparent;background:transparent;padding:4px 2px;font-size:14.5px}
.field:focus{outline:none;border-bottom-color:var(--accent)}
.field::placeholder{color:var(--ink-soft);opacity:.7}
.moods{display:flex;justify-content:space-around;margin-top:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:16px;border:2px solid transparent}
.mood svg{width:44px;height:44px}
.mood[aria-pressed="true"]{background:var(--blush);border-color:var(--rose);color:#6d3f52}

/* task cards */
.shape-toggle{display:flex;background:var(--field);border:2px solid var(--line);border-radius:999px;padding:2px}
.shape-toggle button{padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800}
.shape-toggle button[aria-pressed="true"]{background:var(--pink);color:#6d3f52}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.bar{flex:1;height:12px;border-radius:99px;background:var(--card2);overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint2),var(--sage));border-radius:99px;transition:width .4s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cards.hearts{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px 14px}
@media (max-width:520px){.cards.hearts{grid-template-columns:1fr 1fr;gap:8px}.heart-shape textarea{font-size:11px;line-height:1.2}.heart-shape .tm{font-size:10.5px}.heart-shape .stk{width:24px!important;height:24px!important}.heart-shape .x{width:22px;height:22px;font-size:12px}}
.tcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.tcard{animation:none}.day{transition:none}}
.tcard.box-shape{background:var(--c,var(--blush));border-radius:20px;padding:12px 10px 10px;min-height:172px;border:2px solid rgba(0,0,0,.05)}
.tcard.heart-shape{aspect-ratio:100/92;min-height:0;overflow:hidden;padding:26% 19% 21%;justify-content:center;gap:2px}
.heart-shape>.stk{position:absolute!important;top:12%;right:17%}
.tcard .hbg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.tcard>*:not(.hbg){position:relative;z-index:1}
.tcard .stk{width:40px;height:40px;flex:none}
.heart-shape .stk{width:30px;height:30px}
.tcard textarea{width:100%;border:0;background:transparent;resize:none;text-align:center;font-weight:700;font-size:14px;line-height:1.25;color:#5B4A54;padding:0;min-height:36px}
.heart-shape textarea{font-size:12.5px;min-height:16px;max-height:2.55em;overflow:hidden;flex:none}
.tcard textarea{overflow:hidden}
.heart-shape textarea:focus{overflow-y:auto}
.tcard textarea:focus,.tcard input:focus{outline:none;background:rgba(255,255,255,.55);border-radius:8px}
.tcard .tm{width:86%;border:0;border-top:1.5px dashed rgba(91,74,84,.3);background:transparent;text-align:center;font-size:12.5px;color:#7a6570;padding:3px 0 0;font-weight:700}
.heart-shape .tm{font-size:11px}
.tcard .chk{margin-top:auto;background:rgba(255,255,255,.7);color:#5B4A54;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;display:inline-flex;gap:4px;align-items:center}
.heart-shape .chk{padding:2px 8px;font-size:11px;margin-top:2px}
.tcard.done textarea{text-decoration:line-through;opacity:.6}
.tcard.done .chk{background:var(--forest);color:#fff}
.tcard .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.8);color:#9b5b70;font-weight:800;font-size:16px;line-height:1;display:grid;place-items:center;z-index:2}
.heart-shape .x{top:13%;left:17%;right:auto;width:24px;height:24px;font-size:14px}
.tcard .num{position:absolute;top:8px;left:10px;font-family:"Mali",cursive;font-weight:700;font-size:13px;color:#8a6a78}
.heart-shape .num{display:none}
.add-card{border:2.5px dashed var(--rose);border-radius:20px;min-height:172px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-weight:800;background:transparent}
.add-card .plus{width:52px;height:52px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-size:32px;line-height:1;color:#b0607c}
.add-card.heart{border:0;aspect-ratio:100/92;min-height:0;position:relative}
.add-card.heart svg{position:absolute;inset:0;width:100%;height:100%}
.add-card.heart>span{position:relative}

/* list rows */
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1.5px dashed var(--line)}
.row .bul{width:26px;height:26px;flex:none}
.row .grow{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap}
.row .grow .field{flex:1;min-width:90px}
.row.trow .grow .field:not(.time){flex-basis:100%}
.row .time{width:64px;flex:none;min-width:0!important;text-align:center;background:var(--card2);border-radius:8px}
.row .xs,.frow .xs,.chart-h .xs{width:26px;height:26px;border-radius:50%;background:var(--blush);color:#9b5b70;font-weight:800;flex:none;display:grid;place-items:center;font-size:14px}
.row.checked .field{text-decoration:line-through;opacity:.55}
.cb{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--rose);background:var(--field);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
.cb[aria-checked="true"]{background:var(--sage);border-color:var(--sage)}
.addrow{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--accent);font-size:14px;padding:6px 12px;border-radius:999px;background:var(--add-bg);border:2px dashed var(--rose)}
.addrow b{font-size:18px;line-height:1}
.subj .grow{flex-direction:column;gap:0}
.subj .field.small{font-size:13px;color:var(--ink-soft)}

/* habits */
.habit-scroll{overflow-x:auto}
table.habits{border-collapse:collapse;width:100%;min-width:430px}
.habits th{font-size:12px;font-weight:800;color:var(--ink-soft);padding:4px 2px}
.habits th.cur{color:var(--accent)}
.habits td{padding:4px 2px;border-bottom:1.5px dashed var(--line);text-align:center}
.habits td.hn{text-align:left}
.habits td.hn .field{font-size:13.5px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--rose);display:grid;place-items:center;margin:auto;background:var(--field);color:#fff;font-size:13px;font-weight:800}
.dot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--dot-ink)}
.dot.cur{box-shadow:0 0 0 3px var(--blush)}

/* mood tracker */
.mascot{position:relative;width:52px;height:44px;flex:none;margin:-6px 0 -8px 14px}
.mascot>svg:last-child{width:44px;height:44px;position:absolute;right:0;top:0}
.mascot .mh{width:14px;height:13px;position:absolute;left:-6px;top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{display:flex;align-items:center;gap:4px;padding:3px 10px 3px 4px;border-radius:999px;border:2px solid var(--line);background:var(--field);font-size:12.5px;font-weight:800;flex:none}
.chip svg{width:26px;height:26px}
.chip[aria-pressed="true"]{background:var(--pink);border-color:#E7A7C3;color:#6d3f52}
.feel-q{margin:12px 0 6px;font-size:16px}
.feels{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
@media (max-width:520px){.feels{grid-template-columns:repeat(4,1fr)}}
.feel{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:16px;border:2px solid transparent;font-size:12.5px;font-weight:700}
.feel svg{width:48px;height:48px}
.feel[aria-pressed="true"]{background:var(--blush);border-color:var(--rose);color:#6d3f52}
.why{display:flex;align-items:center;gap:8px;margin-top:12px}
.why span{font-size:16px;flex:none}
.why .field{border-bottom:2px solid var(--line)}
/* keuangan */
.chart{border:2px dashed var(--line);border-radius:18px;padding:10px 12px;margin-bottom:12px}
.chart-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ctitle{font-family:"Mali",cursive;font-weight:700;font-size:16px;flex:1}
.chart-b{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.donut-wrap{flex:none;width:170px;margin:0 auto;text-align:center}
.donut svg{width:170px;height:170px}
.total{font-size:13.5px;font-weight:700;color:var(--ink-soft)}
.total b{display:block;color:var(--ink);font-size:17px;font-family:"Mali",cursive}
.legend-list{flex:1;min-width:240px}
.frow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1.5px dashed var(--line);flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid #6B5560;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.fname{flex:1;min-width:80px}
.famt{display:flex;align-items:center;gap:2px;width:110px;flex:none;background:var(--card2);border-radius:10px;padding:0 6px}
.famt span{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.famt .field{text-align:right;min-width:0}
.pct{width:40px;text-align:right;font-weight:800;font-size:13px;color:var(--ink-soft);flex:none}
.palette{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px 36px}
.palette button,.palette .custom{width:26px;height:26px;border-radius:50%;border:2px solid rgba(107,85,96,.35)}
.palette button[aria-pressed="true"]{border-color:#6B5560;box-shadow:0 0 0 2px var(--card),0 0 0 4px #6B5560}
.palette .custom{display:grid;place-items:center;font-size:13px;position:relative;overflow:hidden;background:var(--field);cursor:pointer}
.palette .custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.empty{color:var(--ink-soft);font-size:13.5px;margin:6px 0}
.add-chart{width:100%;border:2.5px dashed var(--rose);border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:var(--accent)}
.add-chart .plus{width:32px;height:32px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-size:22px;color:#b0607c}
@media (max-width:520px){.famt{width:96px}.pct{width:34px}}
/* burger & drawer */
.burger{position:absolute;top:10px;left:14px;width:42px;height:42px;border-radius:14px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;z-index:3}
.burger span{display:block;width:18px;height:2.5px;border-radius:2px;background:var(--ink)}
.burger span:nth-child(2){width:13px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(60,40,50,.35);z-index:30;opacity:0;transition:opacity .3s var(--ease)}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--card);border-right:2px solid var(--line);z-index:31;transform:translateX(-105%);transition:transform .38s var(--ease),box-shadow .38s;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-radius:0 26px 26px 0}
.drawer.open{transform:none;box-shadow:8px 0 30px rgba(60,40,50,.18)}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.drawer-h b{flex:1;font-size:20px}
.dbuddy{width:40px}
.drawer .xs{width:30px;height:30px;border-radius:50%;background:var(--blush);color:#9b5b70;font-weight:800}
.dlink{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card2);font-weight:800;text-align:left}
.dlink span{width:30px;flex:none}
.dlink:hover,.dlink:focus-visible{background:var(--blush);color:#6d3f52}
.dlink.cur{background:var(--pink);color:#6d3f52}
.dnote{font-size:13px;color:var(--ink-soft);margin-top:auto}
/* report */
.rep-pick{display:flex;gap:8px;justify-content:center;margin:4px 0 14px}
.rep-pick select{appearance:none;-webkit-appearance:none;border:2px solid var(--line);background:var(--field);border-radius:14px;padding:6px 14px;font-family:"Mali",cursive;font-weight:700;font-size:16px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sum{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.sum small{display:block;font-weight:800;color:var(--ink-soft);font-size:12.5px}
.sum b{font-family:"Mali",cursive;font-size:20px;display:block}
.sum .cmp{font-size:12px;font-weight:700;color:var(--ink-soft)}
.rep-grp{margin-bottom:14px}
.rlist .frow{flex-wrap:nowrap}
.rdot{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid #6B5560}
.rname{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ramt{font-weight:800;white-space:nowrap}
.bars-t{font-family:"Mali",cursive;font-weight:700;margin:14px 0 4px}
.bars{overflow-x:auto}
.bars svg{min-width:520px;width:100%;height:auto}
.bars rect.hit{cursor:pointer}
.rep-empty{text-align:center;background:var(--card);border:2px dashed var(--line);border-radius:22px;padding:24px 16px}
.rep-empty svg{width:120px;margin:0 auto 8px}
/* reorder */
.hint{text-align:center;font-size:13px;color:var(--ink-soft);margin:-6px 0 12px}
.grip{width:26px;height:30px;flex:none;border-radius:8px;font-size:18px;line-height:1;color:var(--ink-soft);cursor:grab;touch-action:none;display:grid;place-items:center;margin-left:-6px}
.grip:hover{background:rgba(255,255,255,.5)}
.box.dragging{opacity:.75;outline:3px dashed var(--accent);outline-offset:2px;transform:scale(.99)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.box-h .boxdel{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.7);color:#9b5b70;font-weight:800;flex:none;display:grid;place-items:center;font-size:13px}
.addbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:16px;padding:12px;border:2.5px dashed var(--rose);border-radius:20px}
.addbox .addrow{margin-top:0}
.addbox>span{font-weight:700;font-size:15px}
/* language picker */
.dsec{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.dsec>label{font-size:15px;padding-left:4px;font-weight:700}
.lang-wrap{position:relative}
.lang-wrap select{width:100%;appearance:none;-webkit-appearance:none;border:2px solid var(--line);background:var(--field);color:var(--ink);border-radius:14px;padding:10px 38px 10px 12px;font-weight:800;font-size:15px;cursor:pointer}
.lang-wrap select:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.lang-wrap .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--accent);font-size:16px}
.tcard{cursor:grab;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .2s var(--ease),box-shadow .2s var(--ease),opacity .2s}
.tcard textarea,.tcard input{-webkit-user-select:text;user-select:text;cursor:text}
.tcard.pressing{transform:scale(.97)}
.tcard.tdragging{transform:scale(1.05) rotate(-1.5deg);opacity:.92;z-index:5;cursor:grabbing;filter:drop-shadow(0 10px 14px rgba(107,85,96,.28))}
.box-shape.tdragging{box-shadow:0 10px 22px rgba(107,85,96,.25)}
/* motion */
:root{--ease:cubic-bezier(.22,.9,.28,1)}
button,.day,.chip,.feel,.lang-wrap select{transition:transform .18s var(--ease),background-color .25s,color .25s,border-color .25s,box-shadow .25s}
.addrow:active,.nav-btn:active,.daynav:active,.back:active,.pill:active,.chip:active,.feel:active,.glass:active,.cb:active,.dot:active,.swatch:active,.xs:active,.chk:active,.add-card:active,.add-chart:active,.dlink:active,.stk:active,.iic:active,.burger:active,.theme-btn:active,.shape-toggle button:active,.mood:active{transform:scale(.93)}
.tcard .x:active{transform:scale(.88)}
.view-in{animation:viewIn .42s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast{transition:opacity .25s,transform .3s var(--ease)}
.toast.hidden{display:flex!important;opacity:0;pointer-events:none;transform:translate(-50%,16px)!important}
.bar i{transition:width .5s var(--ease)}
.box{transition:box-shadow .25s}
@media (prefers-reduced-motion:reduce){.view-in{animation:none}button,.day,.chip,.feel,.tcard{transition:none}}
/* undo / redo / save bar */
.hbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;display:flex;gap:6px;padding:6px;
  background:var(--card);border:2px solid var(--line);border-radius:999px;box-shadow:0 8px 24px rgba(107,85,96,.18);transition:opacity .3s,transform .35s var(--ease)}
.hbar.hidden{display:flex!important;opacity:0;pointer-events:none;transform:translate(-50%,24px)}
.hbar button{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;font-weight:800;font-size:14px;background:var(--card2);color:var(--ink)}
.hbar button svg{width:18px;height:18px}
.hbar button:disabled{opacity:.4;cursor:default}
.hbar button:not(:disabled):active{transform:scale(.93)}
.hbar button.primary{background:var(--pink);color:#6d3f52}
.hbar button.primary.ok{background:var(--mint2);color:#3f5a45}
@media (max-width:400px){.hbar button{padding:9px 11px;font-size:13px}}
body.has-hbar .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
/* water */
.water{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center}
.glass{width:44px}
.water-note{text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:8px}
textarea.notes{width:100%;min-height:110px;border:0;resize:vertical;background:
  repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);line-height:28px;padding:0 2px;font-size:14.5px}
textarea.notes:focus{outline:none}
.foot{text-align:center;margin-top:22px;color:var(--ink-soft);font-family:"Mali",cursive;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;z-index:20}
.toast button{color:var(--pink);font-weight:800}
.theme-btn{position:absolute;top:10px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:17px}
</style>
</head>
<body>

<!-- ============ CALENDAR VIEW ============ -->
<main id="calView" class="wrap" style="position:relative">
  <button class="burger" id="burgerBtn" data-i18n-aria="a_openMenu" aria-label="Buka menu" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button>
  <button class="theme-btn" id="themeBtn" data-i18n-aria="a_theme" aria-label="Ganti tema terang/gelap">🌙</button>
  <div class="hero">
    <div class="buddy" data-stk="bear"></div>
    <h1>My<small>Journal</small></h1>
    <div class="buddy" data-stk="bunny"></div>
  </div>
  <p class="tag hand" data-i18n="tagline"></p>

  <section class="cal" data-i18n-aria="calendar" aria-label="Kalender">
    <div class="cal-head">
      <button class="nav-btn" id="prevM" data-i18n-aria="a_prevM" aria-label="Bulan sebelumnya">‹</button>
      <div class="pickers">
        <select id="selMonth" data-i18n-aria="a_pickM"></select>
        <select id="selYear" data-i18n-aria="a_pickY"></select>
      </div>
      <button class="nav-btn" id="nextM" data-i18n-aria="a_nextM" aria-label="Bulan berikutnya">›</button>
    </div>
    <div class="dow" id="dowRow"></div>
    <div class="days" id="days"></div>
    <div class="cal-foot">
      <button class="pill" id="goToday" data-i18n="today"></button>
      <div class="legend">
        <span><i class="lg-sw" style="background:#B1D3B9;box-shadow:inset 0 0 0 1.5px #8FA28A"></i><i data-i18n="lgToday" style="font-style:normal"></i></span>
        <span><i class="lg-sw" style="background:#F7C8E0;box-shadow:inset 0 0 0 1.5px #D98FA6"></i><i data-i18n="lgSel" style="font-style:normal"></i></span>
        <span><svg width="13" height="12" viewBox="0 0 100 92"><path d="M50 88C20 66 2 48 2 28 2 12 14 2 28 2c10 0 18 6 22 14C54 8 62 2 72 2c14 0 26 10 26 26 0 20-18 38-48 60Z" fill="none" stroke="#D98FA6" stroke-width="12"/></svg><i data-i18n="hasTasks" style="font-style:normal"></i></span>
        <span><svg width="13" height="12" viewBox="0 0 100 92"><path d="M50 88C20 66 2 48 2 28 2 12 14 2 28 2c10 0 18 6 22 14C54 8 62 2 72 2c14 0 26 10 26 26 0 20-18 38-48 60Z" fill="#8FA28A"/></svg><i data-i18n="allDone" style="font-style:normal"></i></span>
      </div>
    </div>
  </section>

  <div class="quote hand"><div data-stk="chick"></div><span id="quoteText"></span></div>
</main>

<!-- ============ DAY VIEW ============ -->
<main id="dayView" class="wrap hidden">
  <div class="topbar">
    <button class="back" id="backBtn" data-i18n-aria="a_back" aria-label="Kembali ke kalender">‹</button>
    <div class="t"><b id="dvTitle"></b><span id="dvSub"></span></div>
    <span class="saved" id="saved" data-i18n="saved"></span>
    <button class="daynav" id="prevD" data-i18n-aria="a_prevD" aria-label="Hari sebelumnya">‹</button>
    <button class="daynav" id="nextD" data-i18n-aria="a_nextD" aria-label="Hari berikutnya">›</button>
  </div>

  <div class="title-block">
    <div class="sL" data-stk="bear"></div>
    <h2>My<span class="l2">Journal</span></h2>
    <div class="ribbon hand" data-i18n="ribbon"></div>
    <div class="sR" data-stk="bunny"></div>
  </div>

  <p class="hint hand" data-i18n="hint"></p>
  <div class="grid2" id="grid"></div>
  <div class="addbox" id="addBox" role="group" data-i18n-aria="a_addBox"></div>
  <p class="foot" data-i18n="foot"></p>
</main>

<div class="scrim hidden" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Menu" aria-hidden="true" inert>
  <div class="drawer-h"><div class="dbuddy" data-stk="bunny"></div><b class="hand" data-i18n="menu"></b><button class="xs" id="closeMenu" data-i18n-aria="a_closeMenu">✕</button></div>
  <button class="dlink" data-go=""><span data-stk="flower"></span><i data-i18n="calendar" style="font-style:normal"></i></button>
  <button class="dlink" data-go="#/laporan"><span data-stk="piggy"></span><i data-i18n="reportLink" style="font-style:normal"></i></button>
  <div class="dsec"><label class="hand" for="langSel" data-i18n="language"></label>
    <div class="lang-wrap"><select id="langSel">
      <option value="id" lang="id">🇮🇩 Indonesia</option>
      <option value="en" lang="en">🇬🇧 English</option>
      <option value="ja" lang="ja">🇯🇵 日本語</option>
    </select><span class="chev" aria-hidden="true">▾</span></div></div>
  <p class="dnote hand" data-i18n="dnote"></p>
</nav>

<!-- ============ REPORT VIEW ============ -->
<main id="repView" class="wrap hidden">
  <div class="topbar">
    <button class="back" id="repBack" data-i18n-aria="a_back" aria-label="Kembali ke kalender">‹</button>
    <div class="t"><b data-i18n="repTitle"></b><span id="repSub"></span></div>
    <button class="daynav" id="repPrev" data-i18n-aria="a_prevM" aria-label="Bulan sebelumnya">‹</button>
    <button class="daynav" id="repNext" data-i18n-aria="a_nextM" aria-label="Bulan berikutnya">›</button>
  </div>
  <div class="rep-pick"><select id="repMonth" data-i18n-aria="a_pickM"></select><select id="repYear" data-i18n-aria="a_pickY"></select></div>
  <div id="repBody"></div>
</main>
<div class="hbar hidden" id="hbar" role="toolbar" data-i18n-aria="a_hbar">
  <button id="undoBtn" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span data-i18n="hUndo"></span></button>
  <button id="redoBtn" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span data-i18n="hRedo"></span></button>
  <button id="saveBtn" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 17.5c-2.6-1.7-3.8-3-3.8-4.4 0-1 .8-1.8 1.8-1.8.8 0 1.5.5 2 1.2.5-.7 1.2-1.2 2-1.2 1 0 1.8.8 1.8 1.8 0 1.4-1.2 2.7-3.8 4.4Z" fill="currentColor"/><path d="M8.5 3v4h6V3" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="hSave"></span></button>
</div>
<div class="toast hidden" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" data-i18n="undo"></button></div>

<script>
/* ================= STICKERS (karakter lucu) ================= */

const smile = (cx,y)=>`<path d="M${cx-3} ${y}q1.5 2 3 0q1.5 2 3 0" fill="none" ${S}/>`;

const STICKERS = {
  bunny:`<svg viewBox="0 0 48 48"><ellipse cx="17" cy="12" rx="5" ry="11" fill="#fff" ${S}/><ellipse cx="31" cy="12" rx="5" ry="11" fill="#fff" ${S}/><ellipse cx="17" cy="13" rx="2" ry="6.5" fill="#F7C8E0"/><ellipse cx="31" cy="13" rx="2" ry="6.5" fill="#F7C8E0"/><ellipse cx="24" cy="31" rx="15" ry="13" fill="#fff" ${S}/>${eyes(18.5,29.5,30)}${blush(15,33,34.5)}${smile(24,34)}</svg>`,
  bear:`<svg viewBox="0 0 48 48"><circle cx="12" cy="14" r="6" fill="#DDBB98" ${S}/><circle cx="36" cy="14" r="6" fill="#DDBB98" ${S}/><circle cx="12" cy="14" r="2.6" fill="#F5CBCB"/><circle cx="36" cy="14" r="2.6" fill="#F5CBCB"/><circle cx="24" cy="27" r="16" fill="#E8C9A6" ${S}/><ellipse cx="24" cy="32" rx="6.5" ry="5" fill="#F7F4ED"/>${eyes(18,30,25)}<ellipse cx="24" cy="30" rx="2.2" ry="1.6" fill="#5B4A54"/>${blush(13.5,34.5,31)}${smile(24,32.5)}</svg>`,
  cat:`<svg viewBox="0 0 48 48"><path d="M8 22 9 6l11 8M40 22 39 6l-11 8" fill="#C5B3D3" ${S}/><ellipse cx="24" cy="28" rx="17" ry="14" fill="#C5B3D3" ${S}/><path d="M11 9.5l4.5 4M37 9.5l-4.5 4" stroke="#F7C8E0" stroke-width="3" stroke-linecap="round"/>${eyes(17.5,30.5,27)}${blush(13,35,32)}${smile(24,31)}<path d="M5 28h6M5 32l6-1M43 28h-6M43 32l-6-1" fill="none" ${S} stroke-width="1.4"/></svg>`,
  chick:`<svg viewBox="0 0 48 48"><path d="M24 7c-1-3 2-4 3-2" fill="none" ${S}/><ellipse cx="24" cy="27" rx="16" ry="16" fill="#FFE7A3" ${S}/><path d="M9 29c-4 0-5 5-1 6M39 29c4 0 5 5 1 6" fill="#FFE7A3" ${S}/>${eyes(18.5,29.5,24)}<path d="M21 28h6l-3 3.5Z" fill="#E9A96B" ${S} stroke-width="1.5"/>${blush(14.5,33.5,29)}</svg>`,
  frog:`<svg viewBox="0 0 48 48"><circle cx="15" cy="15" r="7" fill="#B1D3B9" ${S}/><circle cx="33" cy="15" r="7" fill="#B1D3B9" ${S}/><ellipse cx="24" cy="30" rx="18" ry="13" fill="#B1D3B9" ${S}/><circle cx="15" cy="15" r="3.4" fill="#fff"/><circle cx="33" cy="15" r="3.4" fill="#fff"/><circle cx="15" cy="15.5" r="1.8" fill="#5B4A54"/><circle cx="33" cy="15.5" r="1.8" fill="#5B4A54"/>${blush(13,35,31)}<path d="M16 31q8 7 16 0" fill="none" ${S}/></svg>`,
  heart:`<svg viewBox="0 0 48 48"><g transform="translate(4 6) scale(.4)"><path d="${HEART_PATH}" fill="#F7C8E0" stroke="#6B5560" stroke-width="5"/></g><path d="M12 15q2-4 6-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>${eyes(19,29,24)}${blush(15.5,32.5,28)}${smile(24,27.5)}</svg>`,
  leaf:`<svg viewBox="0 0 48 48"><path d="M8 40C8 18 22 7 42 6c0 20-12 34-34 34Z" fill="#C7D3C0" ${S}/><path d="M8 40 30 18M18 30h8M22 24v-7" fill="none" stroke="#8FA28A" stroke-width="2" stroke-linecap="round"/></svg>`,
  flower:`<svg viewBox="0 0 48 48"><g fill="#F5CBCB" ${S}><circle cx="24" cy="11" r="8"/><circle cx="36.5" cy="20" r="8"/><circle cx="32" cy="35" r="8"/><circle cx="16" cy="35" r="8"/><circle cx="11.5" cy="20" r="8"/></g><circle cx="24" cy="24" r="7" fill="#F2D27F" ${S}/>${eyes(21.5,26.5,23)}</svg>`,
  star:`<svg viewBox="0 0 48 48"><path d="M24 4l6 12.5 13.5 2-9.8 9.5 2.3 13.5L24 35l-12 6.5 2.3-13.5L4.5 18.5l13.5-2Z" fill="#F2D98F" ${S}/>${eyes(20,28,23)}${blush(16.5,31.5,27)}${smile(24,26.5)}</svg>`,
  cloud:`<svg viewBox="0 0 48 48"><path d="M13 37c-6 0-9-4-9-8 0-5 4-8 8-8 1-7 6-11 12-11 7 0 11 5 12 10 5 0 8 4 8 8.5S41 37 36 37Z" fill="#C6E7FF" ${S}/>${eyes(19,29,26)}${blush(15.5,32.5,30)}${smile(24,29.5)}</svg>`,

const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE='cubic-bezier(.22,.9,.28,1)';
function flip(sel,key,fn,opt={}){
  const before=new Map();document.querySelectorAll(sel).forEach(el=>before.set(el.getAttribute(key),el.getBoundingClientRect()));
  fn(); if(RM())return;
  document.querySelectorAll(sel).forEach(el=>{const b=before.get(el.getAttribute(key)),a=el.getBoundingClientRect();
    if(!b){if(opt.appear!==false)el.animate([{opacity:0,transform:'scale(.9) translateY(8px)'},{opacity:1,transform:'none'}],{duration:340,easing:EASE});return}
    const dx=b.left-a.left,dy=b.top-a.top; if(Math.abs(dx)>.5||Math.abs(dy)>.5)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:opt.d||300,easing:EASE,composite:'add'});});
}
function vanish(el,cb){if(!el||RM()){cb();return}el.style.pointerEvents='none';
  el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.9)'}],{duration:170,easing:'ease-in'}).finished.then(cb,cb)}
function slideIn(el,dir){if(!el||RM())return;el.animate([{opacity:0,transform:`translateX(${dir*28}px)`},{opacity:1,transform:'none'}],{duration:320,easing:EASE})}

function monthReport(y,m){
  const pre=`day-${y}-${pad(m+1)}-`, keys=[...new Set([...LS.keys(),...Object.keys(cache)])].filter(k=>k.startsWith(pre)).sort();
  const groups={};
  keys.forEach(k=>{const d=load(k); if(!d||!d._saved||!d.fin)return; const date=k.slice(4);
    d.fin.forEach(ch=>{const title=cleanTitle(ch.title)||t('unnamed'), gk=title.toLowerCase();
      ch.items.forEach(i=>{const a=+i.amt||0; if(a<=0)return; const name=(i.name||'').trim()||t('other'), nk=name.toLowerCase();
        const g=groups[gk]||(groups[gk]={title,items:{},days:{},total:0,dates:new Set()});
        const it=g.items[nk]||(g.items[nk]={id:nk,name,amt:0,c:i.c}); it.amt+=a; it.c=i.c;
        (g.days[date]||(g.days[date]={}))[nk]=((g.days[date]||{})[nk]||0)+a; g.total+=a; g.dates.add(date);});});});

function bars(g,y,m){

    let yy=H; const tot=Object.values(o).reduce((a,b)=>a+b,0);
    out+=`<rect x="${x}" y="${top}" width="${W-6}" height="${H-top}" rx="5" fill="var(--card2)"/>`;
    g.list.forEach(it=>{const v=o[it.id]||0; if(!v)return; const h=v/max*(H-top); yy-=h; out+=`<rect x="${x}" y="${yy}" width="${W-6}" height="${h}" fill="${it.c}" stroke="#6B5560" stroke-width=".8"/>`});
    if(tot)out+=`<rect class="hit" data-date="${date}" x="${x}" y="${top}" width="${W-6}" height="${H-top}" fill="transparent"><title>${dayMonth(day,m)}: ${rp(tot)}</title></rect>`;

  const boxes=groups.map((g,gi)=>{const ch={title:g.title,items:g.list};
    const rows=g.list.map(it=>`<div class="frow"><span class="rdot" style="background:${it.c}"></span><span class="rname">${esc(it.name)}</span><span class="ramt">${rp(it.amt)}</span><span class="pct">${Math.round(it.amt/g.total*100)}%</span></div>`).join('');
    return `<section class="box rep-grp">${`<div class="box-h"><div class="ic">${stk(['piggy','star','flower','cloud'][gi%4])}</div><h3>${esc(g.title)}</h3></div>`}<div class="box-b">
      <div class="chart-b"><div class="donut-wrap"><div class="donut">${donut(ch)}</div><div class="total">${t('total')} <b>${rp(g.total)}</b></div></div>
      <div class="legend-list rlist">${rows}</div></div>
      <div class="bars-t">${t('perDay')}</div><div class="bars">${bars(g,y,m)}</div></div></section>`}).join('');
  $('repBody').innerHTML=`<div class="sumrow">${sums}</div>${boxes}`;
}
$('repBody').onclick=e=>{const r=e.target.closest('rect.hit');if(r)location.hash='#/'+r.dataset.date};
const repGo=(y,m)=>{location.hash=`#/laporan/${y}-${pad(m+1)}`};
$('repPrev').onclick=()=>{let y=state.y,m=state.m-1;if(m<0){m=11;y--}repGo(y,m)};
$('repNext').onclick=()=>{let y=state.y,m=state.m+1;if(m>11){m=0;y++}repGo(y,m)};
$('repMonth').onchange=e=>repGo(state.y,+e.target.value);$('repYear').onchange=e=>repGo(+e.target.value,state.m);
$('repBack').onclick=()=>{location.hash=''};

/* ---- geser urutan kotak ---- */
let drag=null;
function saveOrder(){histBreak();const ids=[...$('grid').children].map(x=>x.dataset.box);const L=layout();L.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));saveLayout()}
$('grid').addEventListener('pointerdown',e=>{const g=e.target.closest('.grip');if(!g)return;e.preventDefault();
  drag={sec:g.closest('section'),y:e.clientY};drag.sec.classList.add('dragging');document.body.classList.add('is-dragging')});
window.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();
  const el=document.elementFromPoint(e.clientX,e.clientY),over=el&&el.closest('#grid > section');
  if(over===drag.sec)drag.last=null;
  else if(over&&over!==drag.last){const kids=[...$('grid').children];
    flip('#grid > section','data-box',()=>{if(kids.indexOf(over)<kids.indexOf(drag.sec))over.before(drag.sec); else over.after(drag.sec)},{d:260});
    drag.last=over;}
  if(e.clientY<70)window.scrollBy(0,-14); else if(e.clientY>innerHeight-70)window.scrollBy(0,14);},{passive:false});
function endDrag(){if(!drag)return;drag.sec.classList.remove('dragging');document.body.classList.remove('is-dragging');drag=null;saveOrder()}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
$('grid').addEventListener('keydown',e=>{const g=e.target.closest('.grip');if(!g||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();
  const sec=g.closest('section');if(e.key==='ArrowUp'&&sec.previousElementSibling)sec.previousElementSibling.before(sec);
  else if(e.key==='ArrowDown'&&sec.nextElementSibling)sec.nextElementSibling.after(sec);saveOrder();g.focus();toast(t('orderSaved'))});

/* ---- geser urutan kotak tugas (tahan & geser di mana saja) ---- */
let tpress=null,tdrag=null,suppressClick=false;
function cancelPress(){if(tpress){clearTimeout(tpress.timer);tpress.card.classList.remove('pressing');tpress=null}}
function startTaskDrag(){if(!tpress)return;clearTimeout(tpress.timer);const card=tpress.card;tpress=null;
  card.classList.remove('pressing');if(document.activeElement&&card.contains(document.activeElement))document.activeElement.blur();
  try{getSelection().removeAllRanges()}catch(e){} if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  tdrag={card,last:null};card.classList.add('tdragging');document.body.classList.add('is-dragging')}
dayView.addEventListener('pointerdown',e=>{const card=e.target.closest('#sec-tasks .tcard');if(!card||e.button>0||tdrag)return;
  const onField=!!e.target.closest('textarea,input,button');
  const hold=e.pointerType==='mouse'?(onField?400:null):380;
  tpress={card,x:e.clientX,y:e.clientY,type:e.pointerType,onField,timer:hold?setTimeout(startTaskDrag,hold):0};
  if(hold)setTimeout(()=>{if(tpress&&tpress.card===card)card.classList.add('pressing')},120)});
window.addEventListener('pointermove',e=>{
  if(tpress){const dist=Math.hypot(e.clientX-tpress.x,e.clientY-tpress.y);
    if(tpress.type==='mouse'&&!tpress.onField&&dist>5)startTaskDrag(); else if(dist>9)cancelPress()}
  if(!tdrag)return;e.preventDefault();
  const el=document.elementFromPoint(e.clientX,e.clientY),over=el&&el.closest('.tcard');
  if(over===tdrag.card)tdrag.last=null;
  else if(over&&over.parentNode===tdrag.card.parentNode&&over!==tdrag.last){const kids=[...over.parentNode.children],card=tdrag.card;
    flip('#sec-tasks .tcard','data-id',()=>{if(kids.indexOf(over)<kids.indexOf(card))over.before(card);else over.after(card)},{d:260});tdrag.last=over}
  if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>innerHeight-70)window.scrollBy(0,14)},{passive:false});
dayView.addEventListener('touchmove',e=>{if(tdrag)e.preventDefault()},{passive:false});
dayView.addEventListener('contextmenu',e=>{if((tpress||tdrag)&&e.target.closest('.tcard'))e.preventDefault()});
function saveTaskOrder(){histBreak();const d=getDay(state.date),ids=[...$('sec-tasks').querySelectorAll('.tcard')].map(c=>c.dataset.id);
  d.tasks.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));save('day-'+state.date);
  $('sec-tasks').querySelectorAll('.tcard').forEach((c,i)=>{const n=c.querySelector('.num');if(n)n.textContent=i+1})}
function endTaskDrag(){cancelPress();if(!tdrag)return;tdrag.card.classList.remove('tdragging');document.body.classList.remove('is-dragging');tdrag=null;
  suppressClick=true;setTimeout(()=>suppressClick=false,60);saveTaskOrder()}
window.addEventListener('pointerup',endTaskDrag);window.addEventListener('pointercancel',endTaskDrag);
dayView.addEventListener('click',e=>{if(suppressClick){e.stopPropagation();e.preventDefault();suppressClick=false}},true);

/* ---- urungkan / ulangi / simpan ---- */
const HIST={}; let histApplying=false, histSrc='', histN=0;
const snapNow=()=>JSON.stringify({d:cache['day-'+state.date]||null,ti:cache.titles||{}});
function hist(){if(!state.date)return null;return HIST[state.date]||(HIST[state.date]={undo:[],redo:[],base:snapNow(),group:null})}
function histTrack(key){if(histApplying||!state.date||(key!=='day-'+state.date&&key!=='titles'))return;
  const h=hist(),cur=snapNow();if(cur===h.base)return;
  if(!h.group||h.src!==histSrc){h.undo.push(h.base);if(h.undo.length>100)h.undo.shift();h.redo=[]}
  clearTimeout(h.group);h.group=setTimeout(()=>{h.group=null},800);h.src=histSrc;h.base=cur;updHist()}
function histBreak(){histSrc='b'+(++histN);const h=hist();if(h){clearTimeout(h.group);h.group=null}}
function updHist(){const h=hist();$('undoBtn').disabled=!h||!h.undo.length;$('redoBtn').disabled=!h||!h.redo.length}
function applySnap(str){const o=JSON.parse(str);histApplying=true;
  const dk='day-'+state.date;
  if(o.d){cache[dk]=o.d;save(dk)}
  cache.titles=o.ti;save('titles');histApplying=false;
  const h=hist();h.base=snapNow();state.openColor=null;
  flip('#grid > section','data-box',renderDay);updHist()}
function doUndo(){const h=hist();if(!h||!h.undo.length)return;histBreak();h.redo.push(snapNow());applySnap(h.undo.pop());toast(t('undone'))}
function doRedo(){const h=hist();if(!h||!h.redo.length)return;histBreak();h.undo.push(snapNow());applySnap(h.redo.pop());toast(t('redone'))}
function flushSave(){Object.keys(timers).forEach(k=>{clearTimeout(timers[k]);delete timers[k];if(cache[k])cloudSet(k,cache[k])});
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const b=$('saveBtn');b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1400);toast(t('savedAll'))}
$('undoBtn').onclick=doUndo;$('redoBtn').onclick=doRedo;$('saveBtn').onclick=flushSave;
document.addEventListener('keydown',e=>{if(dayView.classList.contains('hidden'))return;const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;if(!mod)return;
  if(k==='s'){e.preventDefault();flushSave();return}
  if(e.target.closest('input,textarea,select'))return;
  if(k==='z'&&!e.shiftKey){e.preventDefault();doUndo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();doRedo()}});
dayView.addEventListener('click',()=>{histSrc='c'+(++histN);histBreak()},true);
dayView.addEventListener('input',e=>{const el=e.target,d=el.dataset;histSrc='i:'+(d.f||d.fin||d.title||'')+':'+(d.id||d.cid||d.title||'')},true);

function route(){
  const m=location.hash.match(/^#\/(\d{4}-\d{2}-\d{2})$/), r=location.hash.match(/^#\/laporan(?:\/(\d{4})-(\d{2}))?$/);
  const prevView=['calView','dayView','repView'].find(v=>!$(v).classList.contains('hidden'));
  ['calView','dayView','repView'].forEach(v=>$(v).classList.add('hidden'));
  if(m){dayView.classList.remove('hidden');openDay(m[1])}
  else if(r){if(state.date){const d=parse(state.date);state.y=d.getFullYear();state.m=d.getMonth()}state.date=null;
    $('repView').classList.remove('hidden');renderReport(r[1]?+r[1]:state.y,r[2]?+r[2]-1:state.m);window.scrollTo(0,0)}
  else{const back=!!state.date;if(state.date){const d=parse(state.date);state.y=d.getFullYear();state.m=d.getMonth()}state.date=null;
    $('calView').classList.remove('hidden');state.selPop=back&&!RM();renderCalendar();state.selPop=false}
  const nowView=m?'dayView':r?'repView':'calView';
  $('hbar').classList.toggle('hidden',nowView!=='dayView');document.body.classList.toggle('has-hbar',nowView==='dayView');if(nowView==='dayView'){hist();updHist()}
  if(nowView!==prevView){const el=$(nowView);el.classList.remove('view-in');void el.offsetWidth;el.classList.add('view-in')}
}
window.addEventListener('hashchange',route);
dayView.addEventListener('focusout',e=>{if(e.target.matches('.heart-shape textarea'))e.target.scrollTop=0});

/* ---- theme ---- */
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
  const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;$('themeBtn').textContent=dark?'☀️':'🌙'}
applyTheme(LS.get('pref-theme'));
$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const t=dark?'light':'dark';LS.set('pref-theme',t);applyTheme(t)};
/* ---- terapkan bahasa ---- */
function applyLang(rerender){
  const L=I18N[LANG]||I18N.id; MONTHS=L.months; DAYS=L.days; document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  ['selMonth','repMonth'].forEach(id=>{const sel=$(id),v=sel.value;sel.innerHTML=MONTHS.map((n,i)=>`<option value="${i}">${n}</option>`).join('');if(v!=='')sel.value=v});
  $('dowRow').innerHTML=t('dow').map((x,i)=>`<div>${x}</div>`).join('');
  const q=t('quotes');$('quoteText').textContent=q[new Date().getDate()%q.length];
  $('langSel').value=LANG;
  if(rerender)route();
}
$('langSel').onchange=e=>{LANG=e.target.value;prefs().lang=LANG;save('prefs');applyLang(true)};
LANG=(prefs().lang&&I18N[prefs().lang])?prefs().lang:'id';
applyLang(false);
route();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
